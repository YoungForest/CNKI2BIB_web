name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, but don't cancel an in-progress run
# (so a previous deploy completes cleanly before a new one starts).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        env:
          # Site is served at https://<owner>.github.io/<repo>/, so Vite needs
          # the base path. If a custom domain is configured later (CNAME at
          # the apex), change this to '/'.
          VITE_BASE: /${{ github.event.repository.name }}/
          # Google Analytics 4 Measurement ID. NOT a secret — Measurement IDs
          # are public (anyone can read them in the served HTML). We expose it
          # as a build-time env var so dev/local builds don't ping production
          # analytics. Set to empty to disable analytics entirely.
          VITE_GA_ID: G-P6QFYZQK6S
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
